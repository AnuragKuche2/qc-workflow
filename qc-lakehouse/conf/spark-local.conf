# Delta Lake wiring for the local dev-loop Spark session only. Not used for real pipeline
# runs - those happen on Databricks. No metastore config on purpose: local Spark uses its
# default in-memory catalog (see spec section 3, "No local Postgres / local Hive metastore").
spark.sql.extensions                 io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog      org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.sql.warehouse.dir              ./warehouse
spark.sql.shuffle.partitions         4
# spark.driver.memory is intentionally NOT set here. In local/client mode the driver JVM is
# already started by the py4j gateway before SparkConf is applied via .config(...) in
# application code, so setting spark.driver.memory this way is silently ignored (documented
# Spark behavior). If driver memory ever actually needs tuning, use PYSPARK_SUBMIT_ARGS or the
# SPARK_DRIVER_MEMORY environment variable instead - both are read before JVM launch.
