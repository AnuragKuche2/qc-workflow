bundle:
  name: qc_lakehouse

artifacts:
  qc_lakehouse_wheel:
    type: whl
    build: uv build --wheel
    path: .

variables:
  warehouse_id:
    description: >-
      SQL warehouse ID used by the dbt Databricks Jobs (dbt_build_test_staging,
      dbt_build_test_intermediate, dbt_build_test_marts). Databricks UI: SQL Warehouses ->
      your warehouse -> Connection details -> HTTP Path (the ID is the trailing path segment).
      Override via `databricks bundle deploy --var="warehouse_id=..."` for a different workspace.
    default: ca865a4ef1668613

resources:
  jobs:
    generate_reference_data:
      name: generate_reference_data
      tasks:
        - task_key: main
          spark_python_task:
            python_file: ./scripts/generate_reference_data.py
          environment_key: qc_lakehouse_env
      environments:
        - environment_key: qc_lakehouse_env
          spec:
            environment_version: "3"
            dependencies:
              - ./dist/*.whl
              - python-dotenv

    generate_fact_data:
      name: generate_fact_data
      tasks:
        - task_key: main
          spark_python_task:
            python_file: ./scripts/generate_fact_data.py
          environment_key: qc_lakehouse_env
      environments:
        - environment_key: qc_lakehouse_env
          spec:
            environment_version: "3"
            dependencies:
              - ./dist/*.whl
              - python-dotenv

    generate_benchmark_orders:
      name: generate_benchmark_orders
      tasks:
        - task_key: main
          spark_python_task:
            python_file: ./perf_lab/generate_benchmark_orders.py
            # day_offset=90 is intentionally out of range (the full window is 90 days total) -
            # resolve_window already raises a clear ValueError once day_offset >= total_days,
            # so an accidental unparameterized "Run now"/retry fails fast instead of silently
            # re-appending duplicate order_ids into an already-populated table. Always override
            # both flags explicitly for a real invocation.
            parameters: ["--day-offset", "90", "--window-days", "10"]
          environment_key: qc_lakehouse_env
      environments:
        - environment_key: qc_lakehouse_env
          spec:
            environment_version: "3"
            dependencies:
              - ./dist/*.whl
              - python-dotenv

    apply_layouts:
      name: apply_layouts
      tasks:
        - task_key: main
          spark_python_task:
            python_file: ./perf_lab/apply_layouts.py
            # One layout per run - the original single-session, all-4-layouts script hit the
            # same INVALID_HANDLE.OPERATION_ABANDONED session-duration failure
            # generate_benchmark_orders.py hit at the 799M-row (561x) benchmark scale. Always
            # override --layout explicitly (baseline/partitioned/zorder/liquid).
            parameters: ["--layout", "baseline"]
          environment_key: qc_lakehouse_env
      environments:
        - environment_key: qc_lakehouse_env
          spec:
            environment_version: "3"
            dependencies:
              - ./dist/*.whl
              - python-dotenv

    dbt_build_test_staging:
      name: dbt_build_test_staging
      tasks:
        # dbt_task has no field to reference a Databricks secret directly, and
        # {{secrets/scope/key}} is not resolved inside dbt_task commands (confirmed live - see
        # scripts/resolve_pii_salt.py's docstring). This task bridges dbutils.secrets.get -> a
        # task value the dbt_task below can reference via --vars.
        # CAVEAT: the resolved value is NOT protected end-to-end - the dbt_task below echoes
        # its own resolved shell command (including the substituted value) into its run
        # output/logs in plaintext, visible to anyone with read/API access to that job run.
        # Known, accepted limitation for this single-user Free Edition workspace - see
        # scripts/resolve_pii_salt.py for details.
        - task_key: resolve_secrets
          spark_python_task:
            python_file: ./scripts/resolve_pii_salt.py
          environment_key: qc_lakehouse_secrets_env
        - task_key: main
          depends_on:
            - task_key: resolve_secrets
          dbt_task:
            project_directory: ./dbt/qc_lakehouse
            commands:
              - "dbt build --select staging --vars '{\"pii_hash_salt\": \"{{tasks.resolve_secrets.values.pii_hash_salt}}\"}'"
            warehouse_id: ${var.warehouse_id}
            catalog: qc_dev
            schema: silver
          environment_key: qc_lakehouse_dbt_env
      environments:
        - environment_key: qc_lakehouse_secrets_env
          spec:
            environment_version: "3"
        - environment_key: qc_lakehouse_dbt_env
          spec:
            environment_version: "3"
            dependencies:
              - dbt-databricks>=1.12.5

    dbt_build_test_intermediate:
      name: dbt_build_test_intermediate
      tasks:
        # Same bridging task as dbt_build_test_staging's - duplicated rather than shared
        # because task values only propagate within one job run's own task DAG, and these are
        # separate top-level jobs (the pipeline DAG triggers them independently in sequence).
        # Same plaintext-in-logs CAVEAT as dbt_build_test_staging - see that job's comment.
        - task_key: resolve_secrets
          spark_python_task:
            python_file: ./scripts/resolve_pii_salt.py
          environment_key: qc_lakehouse_secrets_env
        - task_key: main
          depends_on:
            - task_key: resolve_secrets
          dbt_task:
            project_directory: ./dbt/qc_lakehouse
            commands:
              - "dbt build --select intermediate --vars '{\"pii_hash_salt\": \"{{tasks.resolve_secrets.values.pii_hash_salt}}\"}'"
            warehouse_id: ${var.warehouse_id}
            catalog: qc_dev
            schema: silver
          environment_key: qc_lakehouse_dbt_env
      environments:
        - environment_key: qc_lakehouse_secrets_env
          spec:
            environment_version: "3"
        - environment_key: qc_lakehouse_dbt_env
          spec:
            environment_version: "3"
            dependencies:
              - dbt-databricks>=1.12.5

    dbt_build_test_marts:
      name: dbt_build_test_marts
      tasks:
        # Same bridging task as dbt_build_test_staging's - see that job's comments for the
        # duplication rationale and the plaintext-in-logs CAVEAT.
        - task_key: resolve_secrets
          spark_python_task:
            python_file: ./scripts/resolve_pii_salt.py
          environment_key: qc_lakehouse_secrets_env
        - task_key: main
          depends_on:
            - task_key: resolve_secrets
          dbt_task:
            project_directory: ./dbt/qc_lakehouse
            commands:
              - "dbt build --select marts --vars '{\"pii_hash_salt\": \"{{tasks.resolve_secrets.values.pii_hash_salt}}\"}'"
            warehouse_id: ${var.warehouse_id}
            catalog: qc_dev
            schema: silver
          environment_key: qc_lakehouse_dbt_env
      environments:
        - environment_key: qc_lakehouse_secrets_env
          spec:
            environment_version: "3"
        - environment_key: qc_lakehouse_dbt_env
          spec:
            environment_version: "3"
            dependencies:
              - dbt-databricks>=1.12.5

    # NOTE: adapted from the brief's draft. The brief guessed a job-level `parameters:`
    # block (JobParameterDefinition - name/default) would be passed as CLI args to the
    # spark_python_task automatically. `make bundle-validate` accepted that shape (it's
    # valid schema), but the first live smoke run of optimize_fct_orders proved it doesn't
    # do what was assumed: job-level parameters are named substitution variables
    # (referenced elsewhere via `{{job.parameters.<name>}}`), not auto-appended argv - the
    # task failed with `--operation` missing entirely. Checked `databricks bundle schema`
    # (jobs.SparkPythonTask): the actual CLI-args field is `spark_python_task.parameters`,
    # a plain list of strings passed directly to the Python file. Fixed here; run_maintenance.py
    # itself needed no change since it already just scans sys.argv for `--operation`.
    optimize_gold_table:
      name: optimize_gold_table
      # Deliberate design choice, not an accidental default: the DAG's dynamic task mapping
      # fires up to 7 concurrent run-now calls against this one job (one per gold table).
      # max_concurrent_runs: 1 serializes them Databricks-side - required because Free
      # Edition caps concurrent job tasks at 5 account-wide, and a quota overrun shuts down
      # all workspace compute for the day.
      max_concurrent_runs: 1
      tasks:
        - task_key: main
          spark_python_task:
            python_file: ./perf_lab/run_maintenance.py
            parameters: ["--operation", "optimize", "--table", "fct_orders"]
          environment_key: qc_lakehouse_env
      environments:
        - environment_key: qc_lakehouse_env
          spec:
            environment_version: "3"
            dependencies:
              - ./dist/*.whl
              - python-dotenv

    analyze_gold_table:
      name: analyze_gold_table
      # Deliberate design choice, not an accidental default: the DAG's dynamic task mapping
      # fires up to 7 concurrent run-now calls against this one job (one per gold table).
      # max_concurrent_runs: 1 serializes them Databricks-side - required because Free
      # Edition caps concurrent job tasks at 5 account-wide, and a quota overrun shuts down
      # all workspace compute for the day.
      max_concurrent_runs: 1
      tasks:
        - task_key: main
          spark_python_task:
            python_file: ./perf_lab/run_maintenance.py
            parameters: ["--operation", "analyze", "--table", "fct_orders"]
          environment_key: qc_lakehouse_env
      environments:
        - environment_key: qc_lakehouse_env
          spec:
            environment_version: "3"
            dependencies:
              - ./dist/*.whl
              - python-dotenv

    vacuum_gold_table:
      name: vacuum_gold_table
      # Deliberate design choice, not an accidental default: the DAG's dynamic task mapping
      # fires up to 7 concurrent run-now calls against this one job (one per gold table).
      # max_concurrent_runs: 1 serializes them Databricks-side - required because Free
      # Edition caps concurrent job tasks at 5 account-wide, and a quota overrun shuts down
      # all workspace compute for the day.
      max_concurrent_runs: 1
      tasks:
        - task_key: main
          spark_python_task:
            python_file: ./perf_lab/run_maintenance.py
            parameters: ["--operation", "vacuum", "--table", "fct_orders"]
          environment_key: qc_lakehouse_env
      environments:
        - environment_key: qc_lakehouse_env
          spec:
            environment_version: "3"
            dependencies:
              - ./dist/*.whl
              - python-dotenv

targets:
  dev:
    default: true
