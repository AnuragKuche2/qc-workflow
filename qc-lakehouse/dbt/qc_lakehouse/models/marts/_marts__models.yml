version: 2

models:
  - name: dim_customer
    description: Customer dimension. email/phone are masked (see stg_customers).
    columns:
      - name: customer_id
        description: Primary key.
        tests: [unique, not_null]

  - name: dim_restaurant
    description: >
      Restaurant dimension. Deliberately excludes popularity/price-index internals - see
      stg_restaurants.
    columns:
      - name: restaurant_id
        description: Primary key.
        tests: [unique, not_null]

  - name: dim_rider
    description: Rider dimension.
    columns:
      - name: rider_id
        description: Primary key.
        tests: [unique, not_null]

  - name: dim_zone
    description: Zone dimension, with city attributes folded in directly.
    columns:
      - name: zone_id
        description: Primary key.
        tests: [unique, not_null]
      - name: city_id
        tests: [not_null]

  - name: dim_date
    description: >
      Date dimension covering the generator's demand window, one row per date, derived
      directly from stg_demand_daily.
    columns:
      - name: date_day
        description: Primary key.
        tests: [unique, not_null]
      - name: is_weekend
        tests: [not_null]

  - name: fct_orders
    description: >
      Order economics fact - grain is one row per order. subtotal/fees/commission carried
      from bronze via stg_orders; refund_amount and net_revenue computed in
      int_order_economics.
    columns:
      - name: order_id
        description: Primary key (one row per order).
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: restaurant_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_restaurant')
              field: restaurant_id
      - name: zone_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_zone')
              field: zone_id
      - name: date_day
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: net_revenue
        tests: [not_null]
