[project]
name = "qc-lakehouse"
version = "0.1.0"
description = "QC Lakehouse - Databricks + dbt hero quick-commerce data pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-databricks>=1.12.5",
    "delta-spark>=4.4.0",
    "pyspark>=4.2.0",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qc_lakehouse"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.7",
]
