[project]
name = "qc-lakehouse"
version = "0.1.0"
description = "QC Lakehouse - Databricks + dbt hero quick-commerce data pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv>=1.2.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
